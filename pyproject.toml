[build-system]
# Setuptools 84 requires Python 3.10+; preserve the Python 3.9 build path.
requires = [
    "setuptools>=77.0.3; python_version < '3.10'",
    "setuptools>=84.0.0; python_version >= '3.10'",
]
build-backend = "setuptools.build_meta"

[project]
name = "tidydata"
version = "2.0.0"
description = "Python utilities for data tidying, file management, and image privacy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "pypdf",
    "EbookLib",
    "html2text",
    "Pillow",
    "python-docx",
]

[project.optional-dependencies]
s3 = ["boto3"]

[tool.setuptools]
py-modules = [
    "combineMarkdown",
    "combinePDFS",
    "combineTextFiles",
    "docSplice",
    "epubToMarkdown",
    "folderSizer",
    "fileutils",
    "imagekit",
    "imagekit_s3",
    "imagekit_pipeline",
    "surfaceFiles",
]
