[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tidydata"
version = "2.0.0"
description = "Python utilities for data tidying, file management, and image privacy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "pypdf",
    "EbookLib",
    "html2text",
    "Pillow",
    "python-docx",
]

[project.optional-dependencies]
s3 = ["boto3"]

[tool.setuptools]
py-modules = [
    "combineMarkdown",
    "combinePDFS",
    "combineTextFiles",
    "docSplice",
    "epubToMarkdown",
    "folderSizer",
    "imagekit",
    "imagekit_s3",
    "imagekit_pipeline",
    "surfaceFiles",
]
